name: NORDCODE Offline Quality Checks

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'styles.css'
      - 'assets/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify free pages, weekly puzzle, links and locked checkout
        run: python -m unittest discover -s tests -v
